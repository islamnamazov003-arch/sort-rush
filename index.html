<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sort Rush — Fast Sorting Game</title>
  <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f0f1a;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      max-height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    #header {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 480px;
      padding: 16px 20px 8px;
    }

    .stat-box {
      text-align: center;
    }
    .stat-label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
    }
    #best-score-val { color: #f5c542; }

    #lives-display {
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 22px;
    }

    #game-area {
      position: relative;
      width: 100%;
      max-width: 480px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px 12px;
      min-height: 0;
    }

    /* Düşən element */
    #falling-zone {
      width: 100%;
      height: 260px;
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      background: #161628;
    }

    .falling-item {
      position: absolute;
      width: 72px;
      height: 72px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      left: 50%;
      transform: translateX(-50%);
    }
    .falling-item:active { transform: translateX(-50%) scale(0.92); }

    /* Qutular */
    #buckets {
      display: flex;
      gap: 12px;
      width: 100%;
      justify-content: center;
      margin-top: 12px;
    }

    .bucket {
      flex: 1;
      max-width: 100px;
      height: 90px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 800;
      cursor: pointer;
      border: 3px solid transparent;
      transition: transform 0.1s, border-color 0.15s, background 0.15s;
      position: relative;
    }
    .bucket:active { transform: scale(0.94); }
    .bucket.correct-flash {
      animation: correctFlash 0.25s ease;
    }
    .bucket.wrong-flash {
      animation: wrongFlash 0.3s ease;
    }

    @keyframes correctFlash {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.12); }
      100% { transform: scale(1); }
    }
    @keyframes wrongFlash {
      0%,100% { transform: translateX(0); }
      25%     { transform: translateX(-8px); }
      75%     { transform: translateX(8px); }
    }

    /* Kombo göstəricisi */
    #combo-display {
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      color: #f5c542;
      transition: opacity 0.3s;
    }

    /* Sürət çubuğu */
    #speed-bar-wrap {
      width: 100%;
      height: 6px;
      background: #222240;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 8px;
    }
    #speed-bar {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, #4f46e5, #a855f7);
      transition: width 0.4s ease;
    }

    /* Ekranlar */
    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: rgba(10,10,20,0.97);
      z-index: 100;
      padding: 24px;
      text-align: center;
    }
    .screen.hidden { display: none; }

    .screen h1 { font-size: 42px; font-weight: 900; }
    .screen h2 { font-size: 32px; font-weight: 800; }
    .screen p  { font-size: 16px; color: #aaa; max-width: 320px; line-height: 1.5; }

    .btn {
      padding: 16px 48px;
      border-radius: 50px;
      border: none;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.1s;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: linear-gradient(135deg, #4f46e5, #a855f7); color: #fff; }
    .btn-secondary {
      background: transparent;
      color: #888;
      border: 2px solid #333;
      font-size: 16px;
      padding: 12px 32px;
    }

    #gameover-score { font-size: 64px; font-weight: 900; color: #a855f7; }
    #gameover-best  { font-size: 16px; color: #f5c542; }

    /* Reklam yeri - silindi CrazyGames üçün */
  </style>
</head>
<body>

<!-- Başlanğıc ekranı -->
<div class="screen" id="start-screen">
  <h1>⚡ Sort Rush</h1>
  <p>Drop the falling number into the right bucket! Speed increases — can you keep up?</p>
  <button class="btn btn-primary" onclick="startGame()">Play</button>
  <div style="color:#666;font-size:14px">Best: <span id="start-best" style="color:#f5c542">0</span></div>
</div>

<!-- Oyun sonu ekranı -->
<div class="screen hidden" id="gameover-screen">
  <h2>Game Over!</h2>
  <div id="gameover-score">0</div>
  <div id="gameover-best"></div>
  <button class="btn btn-primary" onclick="startGame()">Play Again</button>
  <button class="btn btn-secondary" onclick="showStart()">Home</button>
</div>

<!-- Oyun UI -->
<div id="header">
  <div class="stat-box">
    <div class="stat-label">Score</div>
    <div class="stat-value" id="score-display">0</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">Lives</div>
    <div id="lives-display">❤️ ❤️ ❤️</div>
  </div>
  <div class="stat-box">
    <div class="stat-label">Best</div>
    <div class="stat-value" id="best-score-val">0</div>
  </div>
</div>

<div id="game-area">
  <div id="speed-bar-wrap"><div id="speed-bar" style="width:10%"></div></div>

  <div id="falling-zone">
    <div class="falling-item" id="falling-item" onclick="onItemClick()"></div>
  </div>

  <div id="combo-display"></div>

  <div id="buckets">
    <div class="bucket" id="bucket-0" onclick="chooseBucket(0)"></div>
    <div class="bucket" id="bucket-1" onclick="chooseBucket(1)"></div>
    <div class="bucket" id="bucket-2" onclick="chooseBucket(2)"></div>
    <div class="bucket" id="bucket-3" onclick="chooseBucket(3)"></div>
  </div>
</div>

<script>
  const COLORS = [
    { bg: '#312e81', text: '#818cf8', border: '#4f46e5' },
    { bg: '#701a75', text: '#e879f9', border: '#a855f7' },
    { bg: '#0c4a6e', text: '#38bdf8', border: '#0284c7' },
    { bg: '#064e3b', text: '#34d399', border: '#059669' },
  ];

  let score = 0, lives = 3, combo = 0, speed = 1;
  let gameRunning = false, animFrame = null, itemY = -80;
  let currentValue = 0, bucketValues = [], selectedByClick = false;
  let playCount = 0; // hər 3 oyundan bir reklam

  const BASE_SPEED = 1.2, MAX_SPEED = 5.5;

  // CrazyGames SDK
  let SDK = null;
  (async () => {
    try {
      await window.CrazyGames.SDK.init();
      SDK = window.CrazyGames.SDK;
    } catch (e) { /* SDK yoxdursa oyun normal işləyir */ }
  })();

  function sdkGameplayStart() { try { SDK?.game.gameplayStart(); } catch(e){} }
  function sdkGameplayStop()  { try { SDK?.game.gameplayStop();  } catch(e){} }

  async function showMidgameAd() {
    if (!SDK) return;
    try {
      sdkGameplayStop();
      await SDK.ad.requestAd('midgame');
      sdkGameplayStart();
    } catch(e) { sdkGameplayStart(); }
  }

  function getBest() { return parseInt(localStorage.getItem('sortRushBest') || '0'); }
  function saveBest(v) { localStorage.setItem('sortRushBest', v); }

  function showStart() {
    document.getElementById('start-screen').classList.remove('hidden');
    document.getElementById('gameover-screen').classList.add('hidden');
    document.getElementById('start-best').textContent = getBest();
    if (animFrame) cancelAnimationFrame(animFrame);
    gameRunning = false;
    sdkGameplayStop();
  }

  function showGameOver() {
    gameRunning = false;
    cancelAnimationFrame(animFrame);
    sdkGameplayStop();
    const best = getBest();
    if (score > best) saveBest(score);
    document.getElementById('gameover-score').textContent = score;
    const newBest = getBest();
    document.getElementById('gameover-best').textContent =
      score >= newBest ? '🏆 New Record!' : `Best: ${newBest}`;
    document.getElementById('gameover-screen').classList.remove('hidden');
  }

  async function startGame() {
    playCount++;
    // Hər 3 oyundan bir midgame reklam
    if (playCount > 1 && (playCount - 1) % 3 === 0) {
      await showMidgameAd();
    }

    score = 0; lives = 3; combo = 0; speed = BASE_SPEED;
    selectedByClick = false;
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('gameover-screen').classList.add('hidden');
    updateHUD();
    spawnItem();
    gameRunning = true;
    sdkGameplayStart();
    loop();
  }

  function spawnItem() {
    const nums = shuffle([1, 2, 3, 4]);
    bucketValues = nums;
    currentValue = nums[Math.floor(Math.random() * 4)];
    itemY = -80;
    selectedByClick = false;

    const el = document.getElementById('falling-item');
    const ci = currentValue - 1;
    el.textContent = currentValue;
    el.style.background = COLORS[ci].bg;
    el.style.color = COLORS[ci].text;
    el.style.boxShadow = `0 4px 24px ${COLORS[ci].border}88`;
    el.style.top = itemY + 'px';
    el.style.opacity = '1';

    for (let i = 0; i < 4; i++) {
      const b = document.getElementById('bucket-' + i);
      const ci2 = nums[i] - 1;
      b.textContent = nums[i];
      b.style.background = COLORS[ci2].bg;
      b.style.color = COLORS[ci2].text;
      b.style.borderColor = COLORS[ci2].border + '66';
    }
    updateSpeedBar();
  }

  function loop() {
    if (!gameRunning) return;
    itemY += speed;
    document.getElementById('falling-item').style.top = itemY + 'px';
    const zoneH = document.getElementById('falling-zone').offsetHeight;
    if (itemY > zoneH) {
      handleWrong(-1);
    } else {
      animFrame = requestAnimationFrame(loop);
    }
  }

  function chooseBucket(idx) {
    if (!gameRunning || selectedByClick) return;
    selectedByClick = true;
    cancelAnimationFrame(animFrame);
    const chosen = bucketValues[idx];
    const bucket = document.getElementById('bucket-' + idx);
    if (chosen === currentValue) handleCorrect(bucket);
    else handleWrong(idx);
  }

  function onItemClick() {}

  function handleCorrect(bucket) {
    combo++;
    const multiplier = combo >= 5 ? 2 : 1;
    score += 10 * multiplier;
    speed = Math.min(MAX_SPEED, BASE_SPEED + score / 80);
    bucket.classList.add('correct-flash');
    setTimeout(() => bucket.classList.remove('correct-flash'), 300);
    showCombo(combo, multiplier);
    updateHUD();
    setTimeout(spawnItem, 200);
    setTimeout(() => { if (gameRunning) loop(); }, 220);
  }

  function handleWrong(bucketIdx) {
    lives--;
    combo = 0;
    document.getElementById('combo-display').textContent = '';
    if (bucketIdx >= 0) {
      const b = document.getElementById('bucket-' + bucketIdx);
      b.classList.add('wrong-flash');
      setTimeout(() => b.classList.remove('wrong-flash'), 350);
    }
    updateHUD();
    if (lives <= 0) {
      setTimeout(showGameOver, 300);
    } else {
      setTimeout(spawnItem, 400);
      setTimeout(() => { if (gameRunning) loop(); }, 420);
    }
  }

  function updateHUD() {
    document.getElementById('score-display').textContent = score;
    document.getElementById('best-score-val').textContent = Math.max(score, getBest());
    const hearts = ['❤️ ❤️ ❤️', '❤️ ❤️ 🖤', '❤️ 🖤 🖤', '🖤 🖤 🖤'];
    document.getElementById('lives-display').textContent = hearts[3 - lives] || '🖤 🖤 🖤';
  }

  function updateSpeedBar() {
    const pct = Math.min(100, ((speed - BASE_SPEED) / (MAX_SPEED - BASE_SPEED)) * 100);
    document.getElementById('speed-bar').style.width = (10 + pct * 0.9) + '%';
  }

  function showCombo(c, mult) {
    const el = document.getElementById('combo-display');
    if (c >= 5)      el.textContent = `🔥 ${c}x Combo! ×${mult}`;
    else if (c >= 3) el.textContent = `⚡ ${c}x Combo!`;
    else             el.textContent = '';
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  document.getElementById('start-best').textContent = getBest();
  document.getElementById('best-score-val').textContent = getBest();
</script>

</body>
</html>
